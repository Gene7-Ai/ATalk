#   cffi-2.1.1-cp311-cp311-manylinux2014_aarch64.whl    (ARM64, python 3.11)
#   pycparser-3.11-py3-none-any.whl                     (cffi's dependency;
#     universal wheel, one hash for every platform — still NOT a portable
