# evidence-environment assertions live behind ATALK_FED_EVIDENCE_ENV=1 in
# tests/test_federation_review_fixes.py (EvidenceEnvironmentConsistencyTest).
#
# Evidence host: Linux x86_64, glibc >= 2.34, python 3.11.0rc1.
# Recorded platforms (both verified, see below): manylinux x86_64 AND
# manylinux aarch64, CPython 3.11.  NOT covered: musl, macOS, Windows,
# other CPython minor versions (cffi wheels are cp3XX-specific; pynacl is
# cp38-abi3 and resolves the same on 3.11), PyPy.
#
