# (2) an actual `pip download` of each wheel file followed by sha256sum.
# Both give the same digests, recorded verbatim:
#
#   pynacl-1.6.2-cp38-abi3-manylinux_2_34_x86_64.whl    (the evidence host's
#     platform; resolved by pip at lock-generation time)
#   pynacl-1.6.2-cp38-abi3-manylinux_2_34_aarch64.whl   (ARM64; recorded in
