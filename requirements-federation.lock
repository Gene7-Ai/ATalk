# Federation EVIDENCE-ENVIRONMENT ARTIFACT — NOT a portable dependency lock.
#
# This file records the exact artifacts the round-1 federation vectors were
# generated with and that the evidence-environment assertions assume
# (python==3.11.0rc1, PyNaCl==1.6.2; libsodium exposes no version symbol
# through the PyNaCl 1.6.2 ABI and is pinned by these wheels).  It is NOT a
# portable dependency pin: do NOT use it to install on other platforms or to
# reproduce the runtime environment elsewhere.  The portable contract is the
# optional extra in pyproject.toml (pynacl>=1.5,<2).
#
# FROZEN_VERSIONS in atalk/federation/ed25519strict.py is runtime-collected
